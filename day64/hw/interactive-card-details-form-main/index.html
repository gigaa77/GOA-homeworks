<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="stylesheet" href="index.css">
</head>
<body>


  <div class="parent1">
    <div class="parent2">
      <div class="parent3">
        <img src="./images/card-logo.svg" alt="" class="img1">
        <p class="p1">0000  0000  0000  0000</p>
        <div class="parent5">
          <p class="p2">JANE APPLESEED</p>
          <p class="p2">00/00</p>
        </div>
      </div>
      <div class="parent4">
        <div class="parent6">
          <p class="p2">000</p>
        </div>
      </div>
    </div>

    <div class="parent7">
      <form action="">
        <div class="parent8">
          <label for="name">CARDHOLDER NAME</label>
          <input type="text" id="name" placeholder="e.g. Jane Appleseed" class="all">
        </div>

        <div class="parent8">
          <label for="card">CARD NUMBER</label>
          <input type="text" id="card" class="all" placeholder="e.g. 1234 5678 9123 0000">
        </div>
        <div class="parent9">

          <div class="parent10">
            <label for="number">EXP. DATE (MM/YY)</label>

            <div class="parent12">
              <input type="number" id="number" class="all" placeholder="MM">
              <input type="number" id="number" class="margin all" placeholder="YY">
            </div>

          </div>
          
          <div class="parent11">
            <label for="CVC">CVC</label>
            <input type="text" id="CVC" class="all" placeholder="e.g. 123">
          </div>
          
        </div>

        <button>Confirm</button>

      </form>
    </div>
  </div>
</body>
</html>
